<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--pri:#C0707C;--acc:#2A8378;--pri-s:#F5E4E6;--acc-s:#DDEFEC;--bg:#FAF8F7;--card:#FFFFFF;--tx:#2A2626;--tx2:#8C8483;--line:#EEE8E6;--exp:#D2504A;--inc:#2F7BD0;--sh:0 1px 3px rgba(60,40,40,.06)}
[data-mode=dark]{--bg:#151314;--card:#211E1F;--tx:#EEE8E7;--tx2:#9A918F;--line:#332E2F;--exp:#F0726B;--inc:#66A8F0;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx)}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 6px;gap:10px}
.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.5px}
.top .ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--tx);position:relative}
.top .ib.on{background:var(--pri-s);color:var(--pri)}
.brand{font-size:13px;color:var(--pri);font-weight:700;letter-spacing:2px}
.card{background:var(--card);border-radius:20px;margin:10px 16px;padding:16px;box-shadow:var(--sh)}
.tx2{color:var(--tx2)}.exp{color:var(--exp)}.inc{color:var(--inc)}
.mt0{margin-top:0}.sm{font-size:12px}.b{font-weight:700}
/* week strip */
.week{display:flex;align-items:center;margin:4px 8px 0}
.week .arr{width:28px;height:56px;display:grid;place-items:center;color:var(--tx2)}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{display:flex;flex-direction:column;align-items:center;padding:6px 0 8px;border-radius:14px}
.day small{font-size:11px;color:var(--tx2)}
.day b{font-size:17px;margin-top:3px;font-weight:600}
.day i{width:5px;height:5px;border-radius:50%;margin-top:4px;background:transparent}
.day.has i{background:var(--acc)}
.day.today b{color:var(--acc)}
.day.sel{background:var(--pri);}
.day.sel small,.day.sel b{color:#fff}.day.sel.has i{background:#fff}
/* summary */
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum3 small{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.sum3 b{font-size:18px;font-weight:700;letter-spacing:.2px}
.per{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px}
.per div{background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--sh)}
.per small{font-size:12px;color:var(--tx2)}
.per p{margin:4px 0 0;font-size:13px;font-weight:600;line-height:1.35}
.alert{margin:8px 16px 0;padding:10px 14px;border-radius:14px;background:var(--pri-s);color:var(--tx);font-size:13px;display:flex;gap:8px;align-items:center}
.alert.warn{background:#FDE7E4;color:#9B2C24}
[data-mode=dark] .alert.warn{background:#4A2522;color:#FFB4AC}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 20px 6px}
.sec h3{margin:0;font-size:15px}
/* list */
.list{background:var(--card);border-radius:20px;margin:0 16px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.cic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid small{display:block;color:var(--tx2);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;font-weight:700;white-space:nowrap}
.row .amt small{display:block;font-weight:400;font-size:11px;color:var(--tx2)}
.empty{padding:28px;text-align:center;color:var(--tx2);font-size:14px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:62px;align-items:center}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--tx2)}
nav button.on{color:var(--pri)}
nav .fab{width:54px;height:54px;border-radius:18px;background:var(--acc);color:#fff;margin:-22px auto 0;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.18)}
/* accounts */
.nw{display:flex;justify-content:space-between;align-items:flex-end}
.nw .big{font-size:30px;font-weight:800;letter-spacing:.3px}
.nw .r{text-align:right;font-size:13px;line-height:1.7}
.grp{display:flex;justify-content:space-between;margin:16px 20px 6px;font-size:13px;color:var(--tx2)}
.grip{color:var(--tx2);padding:6px;display:none}
.sorting .grip{display:block}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv small{display:block;color:var(--tx2);font-size:12px}
.kv b{font-size:16px}
/* layers */
#layers .layer{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;opacity:0;transition:opacity .18s}
#layers .layer.on{opacity:1}
.layer.full{background:var(--bg)}
.layer.full .lin{max-width:520px;width:100%;margin:0 auto;height:100%;display:flex;flex-direction:column}
.layer.btm{justify-content:flex-end}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sh{position:relative;background:var(--card);border-radius:22px 22px 0 0;max-height:86vh;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}

.lhd{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;gap:8px}
.lhd .ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px}

.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}

/* add form */
.fscroll{flex:1;overflow:auto;padding-bottom:8px}
.ftop{display:flex;gap:12px;align-items:stretch;margin:6px 16px 10px}
.catbtn{background:var(--card);border-radius:18px;padding:10px;display:flex;align-items:center;gap:10px;min-width:150px;box-shadow:var(--sh);text-align:left}

.amtbox{flex:1;background:var(--card);border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;box-shadow:var(--sh);min-width:0}

.amtbox .big{font-size:32px;font-weight:800;line-height:1.1;word-break:break-all;text-align:right}
.amtbox.expense .big{color:var(--exp)}.amtbox.income .big{color:var(--inc)}
.trw{margin:6px 16px 10px;display:grid;grid-template-columns:1fr 36px 1fr;gap:8px;align-items:center}
.chip{position:relative;background:var(--card);border-radius:16px;padding:10px;display:flex;align-items:center;gap:8px;box-shadow:var(--sh);min-width:0}
.chip span.n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swap{width:36px;height:36px;border-radius:12px;background:var(--acc-s);color:var(--acc);display:grid;place-items:center}
.tamts{margin:0 16px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbox{background:var(--card);border-radius:16px;padding:10px 12px;border:2px solid transparent;box-shadow:var(--sh);text-align:left}
.tbox.on{border-color:var(--acc)}
.tbox small{display:block;font-size:12px;color:var(--tx2)}
.tbox b{display:block;font-size:22px;font-weight:800;margin-top:2px;word-break:break-all}
.tbox .ex{font-size:11px;color:var(--tx2)}
.ov{position:absolute;inset:0;opacity:0;width:100%;height:100%;-webkit-appearance:none;appearance:none;border:0}
.frow{position:relative;margin:0 16px 8px;background:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;min-height:48px;box-shadow:var(--sh);border:2px solid transparent}
.frow.on{border-color:var(--acc)}
.frow .lb{color:var(--tx2);font-size:13px;width:44px;flex:none}
.frow .vl{flex:1;display:flex;justify-content:space-between;gap:8px;min-width:0}
.frow.date{justify-content:space-between;padding:6px}
.frow.date button{width:40px;height:36px;display:grid;place-items:center;color:var(--tx2)}
.frow.date label{position:relative;flex:1;text-align:center;font-weight:600}
textarea.note{display:block;width:calc(100% - 32px);margin:0 16px 8px;border:0;border-radius:14px;padding:12px 14px;background:var(--card);resize:none;min-height:64px;box-shadow:var(--sh);outline:none}
.kp{background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,50px);gap:7px}
.typing .kp{display:none}
.kp button{border-radius:14px;background:var(--bg);font-size:21px;font-weight:600}
.kp .op{background:var(--pri-s);color:var(--pri)}
.kp .ok{grid-column:5;grid-row:3/5;background:var(--acc);color:#fff;font-size:18px}
.kp button:active{filter:brightness(.92)}
/* cat picker */
.cp{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1;min-height:0}
.cp .col{overflow:auto;padding:4px 8px 16px}
.cp .col+.col{border-left:1px solid var(--line)}
.cpi{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;width:100%;text-align:left}
.cpi.on{background:var(--pri-s)}
.cpi .cic{width:34px;height:34px;border-radius:11px}
.cpi.add{color:var(--pri)}
/* forms */
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px}
.fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;text-align:center}
.btn.sec2{background:var(--bg);color:var(--tx);border:1px solid var(--line)}
.btn.del{background:transparent;color:var(--exp)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:32px;height:32px;border-radius:10px;border:3px solid transparent}
.sw button.on{border-color:var(--tx)}
.igrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.igrid button{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--tx2)}
.igrid button.on{background:var(--pri);color:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.tog input{width:22px;height:22px;accent-color:var(--acc)}
/* settings */
.set .row{min-height:52px}
.thm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thm button{border-radius:14px;padding:10px 8px;background:var(--bg);border:2px solid transparent;font-size:12px}
.thm button.on{border-color:var(--pri)}
.thm .dots{display:flex;justify-content:center;gap:4px;margin-bottom:6px}
.thm .dots i{width:16px;height:16px;border-radius:50%}
/* carrier */
.bc{background:#fff;border-radius:20px;margin:16px;padding:22px 10px;text-align:center;box-shadow:var(--sh)}
.bc svg{width:100%;height:auto;max-height:150px}
.bc .code{color:#111;font-size:28px;font-weight:800;letter-spacing:4px;margin-top:8px;font-family:ui-monospace,Menlo,monospace}
.hint{margin:6px 22px;font-size:13px;color:var(--tx2);line-height:1.6}
/* cat manager */
.cm-main{background:var(--bg);border-radius:16px;padding:10px;margin-bottom:10px}
.cm-h{display:flex;align-items:center;gap:10px}
.cm-h b{flex:1}
.cm-subs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cm-subs span{background:var(--card);border-radius:10px;padding:5px 6px 5px 10px;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.cm-subs span button{color:var(--tx2);width:20px;height:20px;display:grid;place-items:center}
.mini{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--tx2)}
.addchip{color:var(--pri)!important;background:transparent!important;border:1px dashed var(--pri)}
.rbar{display:flex;align-items:center;justify-content:space-between;margin:4px 16px 0;gap:8px}
.rbar .nav2{display:flex;align-items:center;gap:2px;font-weight:700}
.rbar .nav2 button{width:34px;height:34px;display:grid;place-items:center;color:var(--tx2)}
.segw{display:flex;justify-content:center;margin:2px 16px 6px}.segw .seg{width:100%}.segw .seg button{flex:1;padding:8px 4px}
.donut{display:flex;justify-content:center;padding:6px 0 2px}
.pbar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tx2);margin-top:6px;justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--tx2);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr:last-child td{border-bottom:0}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mcal .wh{font-size:11px;color:var(--tx2);padding:4px 0}
.mcal button{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px;border-radius:12px;min-height:52px}
.mcal button b{font-size:15px;font-weight:600}
.mcal button i{width:5px;height:5px;border-radius:50%;margin-top:3px;background:transparent}
.mcal button.has i{background:var(--acc)}
.mcal button small{font-size:9px;color:var(--exp);margin-top:1px;white-space:nowrap}
.mcal button.today b{color:var(--acc)}
.mcal button.sel{background:var(--pri)}.mcal button.sel b,.mcal button.sel small{color:#fff}.mcal button.sel.has i{background:#fff}
.mcal .out{visibility:hidden}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 16px 8px;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--card);border-radius:12px;padding:7px 12px;font-size:13px;box-shadow:var(--sh);white-space:nowrap;border:1px solid var(--line)}
#lock{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center}
.lk{display:flex;flex-direction:column;align-items:center;width:260px;color:var(--tx)}
.dots4{display:flex;gap:16px;margin-bottom:28px}.dots4 i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pri)}.dots4 i.on{background:var(--pri)}
.dots4.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lkp{display:grid;grid-template-columns:repeat(3,72px);gap:14px}.lkp button{height:72px;border-radius:50%;background:var(--card);font-size:26px;box-shadow:var(--sh);display:grid;place-items:center}
a[href*="netlify.com"],[id*="netlify" i],[class*="netlify" i]{display:none!important}
.tap{cursor:pointer;border-radius:12px;transition:background .15s}.tap:active{background:var(--pri-s)}
#swipeback{position:fixed;left:0;top:0;z-index:400;width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--pri);box-shadow:0 2px 10px rgba(0,0,0,.25);display:grid;place-items:center;opacity:0;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,26,27,.9);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}

.login{max-width:380px;margin:0 auto;padding:calc(70px + env(safe-area-inset-top)) 24px 40px}
.login h1{font-size:34px;color:var(--pri);margin:0 0 6px;letter-spacing:2px}
.ghost-sortable{opacity:.4}

<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="layers"></div>
<div id="toast"></div>
<script>
/* =========================================================
   Money v1.0
   1) 尚未設定 Firebase 時 = 本機模式（資料存在這支手機的瀏覽器）
   2) 設定好後，把 Firebase 主控台的 firebaseConfig 貼到下面，即自動切換雲端同步
   ---------------------------------------------------------
   Firestore 規則（貼到 Firestore → 規則）：
   rules_version = '2';
   service cloud.firestore {
     match /databases/{database}/documents {
       match /users/{uid} {
         allow read, write: if request.auth != null && request.auth.uid == uid;
       }
       match /ledgers/{lid} {
         allow read, update: if request.auth != null && request.auth.uid in resource.data.members;
         allow create: if request.auth != null && request.auth.uid in request.resource.data.members;
         match /{col}/{doc} {
           allow read, write: if request.auth != null &&
             request.auth.uid in get(/databases/$(database)/documents/ledgers/$(lid)).data.members;
         }
       }
     }
   }
   ========================================================= */
// 功能開關：可在 config.js 用 window.MONEY_OPTIONS = {carrier:false} 關閉載具
const FEAT = {carrier:true, ...(window.MONEY_OPTIONS || {})};
// 雲端設定放在同資料夾的 config.js（換人使用時只要改那個檔）
const FIREBASE_CONFIG = (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey) ? window.FIREBASE_CONFIG : null;
/* 範例：
const FIREBASE_CONFIG = {
  apiKey: "...",
  authDomain: "...",
  projectId: "...",
  storageBucket: "...",
  messagingSenderId: "...",
  appId: "..."
};
*/
const VERSION = 'v2.19';

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => ds(new Date());
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const dim = (y, m) => new Date(y, m+1, 0).getDate();
const wkStart = s => { const d = pd(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return ds(d); };

/* ---------- compute ---------- */
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0);
const accList = (all) => Object.values(S.data.accounts).filter(a => all || !a.archived).sort(byOrder);
const txnSort = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || 0) - (b.createdAt || 0);
const addM = (s, k) => { const d = pd(s), y = d.getFullYear(), m = d.getMonth() + k, yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12; return ds(new Date(yy, mm, Math.min(d.getDate(), dim(yy, mm)))); };
/* 信用卡結帳週期：closeOf＝這天算進哪一個結帳日（當天結帳也算這期） */
const hasCycle = a => !!(a && a.type === 'credit' && a.closeDay);
function cycDate(a, y, m){ y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return ds(new Date(y, m, Math.min(a.closeDay, dim(y, m)))); }
function closeOf(a, date){ const d = pd(date), c = cycDate(a, d.getFullYear(), d.getMonth()); return date <= c ? c : cycDate(a, d.getFullYear(), d.getMonth() + 1); }
function closeAdd(a, close, k){ const d = pd(close); return cycDate(a, d.getFullYear(), d.getMonth() + k); }
/* 這筆消費算進哪一期帳單（打開「商店晚請款（算下期）」就再延一期）；沒有結帳日就是當天 */
function billDate(t){ const a = S.data.accounts[t.accountId]; if (!hasCycle(a)) return t.date; const c = closeOf(a, t.date); return t.nextBill ? closeAdd(a, c, 1) : c; }
const instFee = t => (t.type === 'expense' && t.inst && t.inst.n > 1) ? (+t.inst.fee || 0) : 0;
const poExtra = po => po ? (+po.interest || 0) + (+po.penalty || 0) : 0;
const poPending = po => !!po && !po.zero && (po.interest === null || po.interest === undefined || po.interest === '') && (po.penalty === null || po.penalty === undefined || po.penalty === '');
/* 提前結清：結清日所屬那一期之前的期數不動；剩下的本金併成一筆，加上利息／違約金；沒繳到的手續費不再算 */
function applyPayoff(ps, po, a){
  if (!po || !po.date) return ps;
  const pc = hasCycle(a) ? closeOf(a, po.date) : po.date, keep = ps.filter(p => p.date < pc), rest = ps.slice(keep.length), ex = poExtra(po);
  if (!rest.length && !ex) return keep;
  return [...keep, {date:pc, k:keep.length, amt:rest.reduce((x, p) => x + p.amt, 0), fee:ex, payoff:true, dropped:rest.reduce((x, p) => x + p.fee, 0)}];
}
let IP = {ver:-1, m:new Map()};
/* 消費分期：每一期排在結帳日（第一期＝刷卡後第一個結帳日）；沒設結帳日用刷卡日。amt＝本金、fee＝手續費 */
function instPieces(t){
  if (IP.ver !== VER) IP = {ver:VER, m:new Map()};
  const hit = IP.m.get(t); if (hit) return hit;
  const a = S.data.accounts[t.accountId], n = t.inst.n, out = [], fee = instFee(t);
  const pa = Math.floor(t.amount / n), pf = Math.floor(fee / n), first = hasCycle(a) ? billDate(t) : null;
  for (let k = 0; k < n; k++) out.push({date:first ? closeAdd(a, first, k) : addM(t.date, k), k, amt:k === n - 1 ? t.amount - pa * (n - 1) : pa, fee:k === n - 1 ? fee - pf * (n - 1) : pf});
  const r = applyPayoff(out, t.inst.payoff, a); IP.m.set(t, r); return r;
}
/* 帳單分期／舊分期（plans）：pieces 依信用卡結帳日入帳；amt＝本金、fee＝手續費 */
function planFirst(pl){ const a = S.data.accounts[pl.accountId], [fy, fm] = (pl.firstMonth || today().slice(0, 7)).split('-').map(Number), cd = a && a.closeDay ? a.closeDay : 1; return ds(new Date(fy, fm - 1, Math.min(cd, dim(fy, fm - 1)))); }
function planPieces(pl){
  if (IP.ver !== VER) IP = {ver:VER, m:new Map()};
  const hit = IP.m.get(pl); if (hit) return hit;
  const a = S.data.accounts[pl.accountId], n = Math.max(1, +pl.n || 1), fee = +pl.fee || 0, tot = (+pl.principal || 0) + fee;
  const [fy, fm] = (pl.firstMonth || today().slice(0, 7)).split('-').map(Number), cd = a && a.closeDay ? a.closeDay : 1;
  const per = Math.floor(tot / n), fper = Math.floor(fee / n), out = [];
  for (let k = 0; k < n; k++) { const y = fy + Math.floor((fm - 1 + k) / 12), m = (fm - 1 + k) % 12, pf = k === n - 1 ? fee - fper * (n - 1) : fper, pt = k === n - 1 ? tot - per * (n - 1) : per;
    out.push({date:ds(new Date(y, m, Math.min(cd, dim(y, m)))), k, amt:pt - pf, fee:pf}); }
  const r = applyPayoff(out, pl.payoff, a); IP.m.set(pl, r); return r;
}
const planOffsetDate = pl => pl.kind === 'legacy' ? '1900-01-01' : addM(planFirst(pl), -1);
/* 不跟著單筆紀錄日期走的餘額變動：帳單分期手續費（轉分期那天）、提前結清（結清日：退回沒繳到的手續費、加利息違約金） */
let EV = {ver:-1, l:[]};
function balEvents(){
  if (EV.ver === VER) return EV.l;
  const l = [], po = (aid, date, ps) => { const p = ps.find(x => x.payoff); if (p && (p.dropped || p.fee)) l.push({aid, date, amt:p.dropped - p.fee}); };

    if (!S.data.accounts[pl.accountId]) continue;
    if (pl.kind !== 'legacy' && +pl.fee > 0) l.push({aid:pl.accountId, date:planOffsetDate(pl), amt:-(+pl.fee)});
    if (pl.payoff) po(pl.accountId, pl.payoff.date, planPieces(pl));
  }
  for (const t of Object.values(S.data.txns)) if (t.type === 'expense' && t.inst && t.inst.n > 1 && t.inst.payoff && S.data.accounts[t.accountId]) po(t.accountId, t.inst.payoff.date, instPieces(t));

/* 分期進度：以信用卡最近結帳日為準（沒設結帳日就用今天） */
/* 分期狀態：已繳＝之前的帳單（本期帳單繳清才算本期那一期）；本期未繳＝在本期帳單、帳單還沒繳清；剩＝還沒入帳 */
function pieceStatus(ps, a, ci, d0){

    left:rest.length, per:ps[0] ? ps[0].amt + ps[0].fee : 0, remain:rest.reduce((x, p) => x + p.amt + p.fee, 0), last:ps.length ? ps[ps.length - 1].date : d0};
}
function instStatus(t){ const a = S.data.accounts[t.accountId]; return pieceStatus(instPieces(t), a, a ? cardInfo(a) : null, t.date); }
function delta(t, aid){
  let d = 0;
  if (t.type === 'expense' && t.accountId === aid) d -= t.amount + instFee(t);

  if (t.type === 'transfer') {
    if (t.accountId === aid) d -= t.amount + (t.fee || 0);

function ruleDates(r, upto){

}

function dueList(){

    if (r.active === false) continue;

    for (const d of ruleDates(r, td)) if (d > (r.base || '') && !h.has(d)) out.push({r, date:d});

}

function bars(labels, sets, showEvery = 1){
  const W = 340, H = 170, pb = 20, pt = 14, n = labels.length, g = W / n;
  const bw = Math.max(2, Math.min(12, (g - 3) / sets.length));

  let out = `<line x1="0" x2="${W}" y1="${H - pb}" y2="${H - pb}" style="stroke:var(--line)"/>`;

function buildMoneyImport(rows){
  const C = S.data.categories, A = S.data.accounts;
  const accByName = {}; Object.values(A).forEach(a => accByName[a.name] = a);

  const catIdx = {}; for (const c of Object.values(C)) { if (c.hidden) continue; const m = c.parent ? C[c.parent] : null; catIdx[`${c.type}|${m ? m.name : c.name}|${m ? c.name : ''}`] = c.id; }
  const newAcc = [], newCat = [], newProj = [], txns = []; let skipped = 0;
  const getAcc = (name, cur) => {
    if (!name) return null; if (accByName[name]) return accByName[name].id;
    cur = CUR[cur] ? cur : 'TWD'; const ty = guessType(name, cur);
    const a = {id:'a_' + hashStr('acc|' + name), name, type:ty, currency:cur, init:0, initRate:null, order:Object.keys(A).length + newAcc.length, color:{cash:'#4F6D7A', bank:'#2E86AB', credit:'#D1495B', epay:'#E8A33C', other:'#888888'}[ty], archived:false};

    main = main || '其他'; const k = `${type}|${main}|${sub || ''}`; if (catIdx[k]) return catIdx[k];
    const pk = `${type}|${main}|`; let pid = catIdx[pk];
    if (!pid) { const ico = (MAIN_ICON.find(([re]) => re.test(main)) || [0, 'more'])[1]; pid = 'c_' + hashStr(pk);
      newCat.push({id:pid, type, name:main, parent:null, icon:ico, color:PALETTE[(Object.keys(C).length + newCat.length) % PALETTE.length], order:99 + newCat.length, hidden:false}); catIdx[pk] = pid; }
    if (!sub) return pid;
    const p = newCat.find(c => c.id === pid) || C[pid], id = 'c_' + hashStr(k);
    newCat.push({id, type, name:sub, parent:pid, icon:p.icon, color:p.color, order:99 + newCat.length, hidden:false}); catIdx[k] = id; return id;

    const id = r['ID'] || 'x_' + hashStr([date, r['類型'], r['帳戶'], amt, r['備註'], i].join('|'));
    const old = S.data.txns[id];

    if (!t.accountId) { skipped++; return; }
    if (r['發票號碼']) t.invoice = r['發票號碼'];
    const stv = r['商家'] || r['店家']; if (stv && type !== 'transfer') t.store = stv;
    if (type === 'expense' && parseInt(r['分期期數']) > 1) t.inst = {n:parseInt(r['分期期數']), fee:parseFloat(r['分期手續費']) || 0};
    if (type === 'transfer') {

/* ---------- budget ---------- */
const mKey = (y, m) => `${y}-${pad(m + 1)}`;
function hasBudget(){ const B = S.settings.budget; return !!B && (B.total > 0 || Object.values(B.cats || {}).some(v => v > 0)); }
function spentOf(y, m){
  const out = {_t:0};
  for (const f of flowsIn(ds(new Date(y, m, 1)), ds(new Date(y, m, dim(y, m))))) if (f.type === 'expense') { out._t += f.amt; const k = mainId(f.cat); out[k] = (out[k] || 0) + f.amt; }
  return out;
}
function budgetOf(y, m){
  if (!hasBudget()) return null;
  const B = S.settings.budget, since = B.since || mKey(y, m), cur = mKey(y, m);
  if (cur < since) return null;
  const keys = ['_t', ...Object.keys(B.cats || {}).filter(k => B.cats[k] > 0)], base = k => k === '_t' ? (+B.total || 0) : (+B.cats[k] || 0);
  const carry = Object.fromEntries(keys.map(k => [k, 0]));
  if (B.carry) {
    let [yy, mm] = since.split('-').map(Number); mm--;
    for (let i = 0; i < 600 && mKey(yy, mm) < cur; i++) {
      const sp = spentOf(yy, mm);
      for (const k of keys) if (base(k) > 0) carry[k] += base(k) - (sp[k] || 0);
      mm++; if (mm > 11) { mm = 0; yy++; }
    }
  }
  const sp = spentOf(y, m), mk = k => { const b = base(k), av = b + carry[k], s = sp[k] || 0; return {base:b, carry:carry[k], avail:av, spent:s, remain:av - s, pct:av > 0 ? s / av : (s > 0 ? 9 : 0)}; };
  return {total:base('_t') > 0 ? mk('_t') : null, cats:Object.fromEntries(keys.filter(k => k !== '_t').map(k => [k, mk(k)]))};
}

  if (!hasBudget()) return `${nav}<div class="card"><p class="mt0">還沒有設定預算</p><button class="btn" onclick="openBudgetEdit()">設定預算</button></div>`;

  const totalCard = T ? `<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-end"><div><small class="tx2">本月可用</small><div style="font-size:28px;font-weight:800" class="${T.remain < 0 ? 'exp' : ''}">${twd(T.remain)}</div></div>

function srMatch(){
  const C = S.data.categories, A = S.data.accounts, Pj = S.data.projects;
  const words = SR.q.trim().toLowerCase().split(/\s+/).filter(Boolean), mn = parseFloat(SR.min), mx = parseFloat(SR.max);
  return compute().list.filter(t => {
    if (SR.type && t.type !== SR.type) return false;
    if (SR.acc && t.accountId !== SR.acc && !(t.type === 'transfer' && t.toAccountId === SR.acc)) return false;
    if (SR.cat && !inCatId(t.catId, SR.cat)) return false;
    if (SR.proj && t.projectId !== SR.proj) return false;
    if (SR.from && t.date < SR.from) return false;
    if (SR.to && t.date > SR.to) return false;
    if (!isNaN(mn) && t.amount < mn) return false;
    if (!isNaN(mx) && t.amount > mx) return false;
    if (!words.length) return true;
    const c = C[t.catId], m = c && c.parent ? C[c.parent] : null;
    const hay = [t.note, t.store, t.type === 'transfer' ? '轉帳' : c?.name, m?.name, A[t.accountId]?.name, A[t.toAccountId]?.name, Pj[t.projectId]?.name, String(t.amount), t.invoice, t.date].join(' ').toLowerCase();
    return words.every(w => hay.includes(w));
  }).reverse();
}
function srUpdate(){
  const el = document.getElementById('srres'); if (!el) return;
  const any = SR.q.trim() || SR.type || SR.acc || SR.cat || SR.proj || SR.from || SR.to || SR.min || SR.max;

  const words = SR.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const pls = (words.length || SR.acc) && (!SR.type || SR.type === 'expense') && !SR.cat && !SR.proj ? Object.values(S.data.plans || {}).filter(pl => (!SR.acc || pl.accountId === SR.acc) &&

  for (const t of res) { if (t.type === 'expense') e += tw[t.id].amt + tw[t.id].fee; else if (t.type === 'income') i += tw[t.id].amt; else e += tw[t.id].fee; }
  el.innerHTML = `${pls.length ? `<div class="sec" style="margin-top:6px"><h3>帳單分期・舊分期 <span class="sm tx2" style="font-weight:400">${pls.length} 筆</span></h3></div><div class="list">${pls.map(pl => { const a = A[pl.accountId]; return planRow(pl, planStatus(pl, a ? cardInfo(a) : null), a ? a.currency : 'TWD'); }).join('')}</div>` : ''}

/* ---------- PIN lock ---------- */
async function pinHash(p){
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('money|' + p)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch(e) { return 'h' + hashStr('money|' + p); }
}
let LOCKED = false, LOCK_PENDING = false, PIN_IN = '', hiddenAt = 0;
function lockNow(){ if (!P.pin) return; if (S.ui.tab === 'carrier' && !LAYERS.length) { LOCK_PENDING = true; return; } LOCKED = true; PIN_IN = ''; drawLock(); }
function drawLock(){
  let el = document.getElementById('lock');
  if (!LOCKED) { el && el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'lock'; document.body.appendChild(el); }
  el.innerHTML = `<div class="lk"><div class="brand" style="font-size:16px">MONEY</div><div style="margin:14px 0 18px">${ic('lock',28)}</div><div class="dots4">${[0, 1, 2, 3].map(i => `<i class="${i < PIN_IN.length ? 'on' : ''}"></i>`).join('')}</div>
    <div class="lkp">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k => k ? `<button onclick="pinKey('${k}')">${k === '⌫' ? ic('back',22) : k}</button>` : '<span></span>').join('')}</div>
    <button class="tx2 sm" style="margin-top:18px" onclick="forgotPin()">忘記密碼</button></div>`;
}
async function pinKey(k){
  if (k === '⌫') PIN_IN = PIN_IN.slice(0, -1); else if (PIN_IN.length < 4) PIN_IN += k;
  drawLock();
  if (PIN_IN.length === 4) {
    if (await pinHash(PIN_IN) === P.pin) { LOCKED = false; drawLock(); }
    else { PIN_IN = ''; const d = document.querySelector('#lock .dots4'); d && d.classList.add('shake'); setTimeout(drawLock, 400); }
  }
}
function forgotPin(){
  if (S.mode === 'cloud') { if (!confirm('要登出並重新登入才能清除密碼，確定？')) return; P.pin = null; savePrefs(); LOCKED = false; drawLock(); auth.signOut(); }
  else { if (!confirm('清除密碼鎖？（資料會保留）')) return; P.pin = null; savePrefs(); LOCKED = false; drawLock(); render(); }
}
async function setPin(){
  if (P.pin) {
    const o = prompt('輸入目前的 4 位數密碼'); if (o === null) return;
    if (await pinHash(o) !== P.pin) return toast('密碼錯誤');
    if (confirm('關閉密碼鎖？（按取消改為變更密碼）')) { P.pin = null; savePrefs(); render(); return toast('已關閉密碼鎖'); }
  }
  const a = prompt('設定 4 位數密碼'); if (a === null) return; if (!/^\d{4}$/.test(a)) return toast('請輸入 4 位數字');
  const b = prompt('再輸入一次'); if (b !== a) return toast('兩次不一樣');
  P.pin = await pinHash(a); savePrefs(); render(); toast('已開啟密碼鎖');
}

function sortCatsByUse(){

  const since = ds(new Date(Date.now() - 365 * 864e5)), cnt = {};

  apply(all.filter(c => !c.parent)); for (const m of all.filter(c => !c.parent)) apply(all.filter(c => c.parent === m.id));

      <div class="fld"><label>顏色</label><div class="sw">${PALETTE.map(p => `<button style="background:${p}" class="${ad.color === p ? 'on' : ''}" onclick="CM.adding.color='${p}';redraw('cm')"></button>`).join('')}</div></div>
      <div class="two"><button class="btn sec2" onclick="CM.adding=null;redraw('cm')">取消</button><button class="btn" onclick="saveMain()">儲存</button></div></div>` : '';
  return `<div class="lin"><div class="lhd"><button class="ib" onclick="closeLayer('cm')">${ic('left',24)}</button><h2>分類管理</h2><span style="width:40px"></span></div>
    <div style="display:flex;justify-content:center;margin-bottom:8px"><div class="seg"><button class="${CM.type === 'expense' ? 'on' : ''}" onclick="CM.type='expense';CM.adding=null;redraw('cm')">支出</button><button class="${CM.type === 'income' ? 'on' : ''}" onclick="CM.type='income';CM.adding=null;redraw('cm')">收入</button></div></div>
    <div class="fscroll" style="padding:0 16px 30px">${addForm}
    <button class="btn sec2" style="margin-bottom:10px;padding:10px" onclick="sortCatsByUse()">依常用程度自動排序</button>
    <div id="cmlist">${mains.map(m => { const subs = all.filter(c => c.parent === m.id).sort(byOrder); return `<div class="cm-main" data-id="${m.id}"><div class="cm-h"><span class="cm-grip tx2" style="cursor:grab;touch-action:none;padding:4px">${ic('grip',20)}</span><span class="cic" style="background:${m.color};width:34px;height:34px;border-radius:11px">${ic(m.icon,18)}</span><b>${esc(m.name)}</b>
        <button class="mini" onclick="editMain('${m.id}')">${ic('edit',18)}</button><button class="mini" onclick="hideCat('${m.id}')">${ic('trash',18)}</button></div>
        <div class="cm-subs" data-pid="${m.id}">${subs.map(s => `<span class="sb" data-id="${s.id}"><b style="font-weight:500" onclick="renameCat('${s.id}')">${esc(s.name)}</b><button onclick="hideCat('${s.id}')">${ic('x',14)}</button></span>`).join('')}<span class="addchip" onclick="addSub('${m.id}')" style="padding-right:10px">＋ 子分類</span></div></div>`; }).join('')}</div>
    ${ad ? '' : `<button class="btn sec2" onclick="CM.adding={name:'',icon:'more',color:PALETTE[0]};redraw('cm');document.querySelector('.layer:last-child .fscroll').scrollTop=0">＋ 新增主分類</button>`}
    <div class="hint" style="margin:12px 4px">・主分類：按住左邊 ⋮⋮ 上下拖曳排序<br>・子分類：按住約半秒後拖曳，可排序，也能拖到別的主分類底下（舊紀錄會跟著移過去）<br>・點子分類名稱可改名。刪除只是隱藏，舊紀錄仍保留原分類。</div></div></div>`;
}
function saveMain(){
  const ad = CM.adding; if (!ad.name.trim()) return toast('請輸入名稱');
  if (ad.id) { const c = S.data.categories[ad.id]; Object.assign(c, {name:ad.name.trim(), icon:ad.icon, color:ad.color}); put('categories', c, true);
    Object.values(S.data.categories).filter(s => s.parent === c.id).forEach(s => { s.icon = c.icon; s.color = c.color; put('categories', s, true); }); }
  else { const n = Object.values(S.data.categories).filter(c => c.type === CM.type && !c.parent).length; put('categories', {id:'c_' + uid(), type:CM.type, name:ad.name.trim(), icon:ad.icon, color:ad.color, parent:null, order:n, hidden:false}, true); }

}
function editMain(id){ const c = S.data.categories[id]; CM.adding = {id, name:c.name, icon:c.icon, color:c.color}; redraw('cm'); }
function addSub(pid){ const n = prompt('子分類名稱'); if (!n || !n.trim()) return; const p = S.data.categories[pid]; const k = Object.values(S.data.categories).filter(c => c.parent === pid).length; put('categories', {id:'c_' + uid(), type:p.type, name:n.trim(), icon:p.icon, color:p.color, parent:pid, order:k, hidden:false}, true); redraw('cm'); }
function renameCat(id){ const c = S.data.categories[id]; const n = prompt('改名', c.name); if (!n || !n.trim()) return; c.name = n.trim(); put('categories', c, true); redraw('cm'); }
function hideCat(id){
  const c = S.data.categories[id]; if (id === FEE_CAT) return toast('手續費分類是系統用的，不能刪');
  if (!confirm(`刪除「${c.name}」${c.parent ? '' : '（含子分類）'}？`)) return;
  c.hidden = true; put('categories', c, true);
  if (!c.parent) Object.values(S.data.categories).filter(s => s.parent === id && s.id !== FEE_CAT).forEach(s => { s.hidden = true; put('categories', s, true); });

}

/* project manager */
function openProjMgr(){ openLayer('pm', renderProjMgr, 'full'); }
function renderProjMgr(){
  const c = compute();
  const ps = Object.values(S.data.projects).filter(p => !p.hidden).sort((a, b) => (a.archived - b.archived) || (b.createdAt || 0) - (a.createdAt || 0));
  const tot = id => { let e = 0, i = 0; for (const f of c.flows) if (f.proj === id) { if (f.type === 'expense') e += f.amt; else i += f.amt; } return {e, i}; };
  return `<div class="lin"><div class="lhd"><button class="ib" onclick="closeLayer('pm')">${ic('left',24)}</button><h2>專案</h2><button class="ib" onclick="newProj()">${ic('plus',24)}</button></div>
    <div class="fscroll"><div class="list">${ps.length ? ps.map(p => { const s = tot(p.id); return `<div class="row"><span class="cic" style="background:${p.archived ? 'var(--tx2)' : 'var(--acc)'}">${ic('folder',20)}</span>
      <span class="mid"><b>${esc(p.name)}${p.archived ? '（已結束）' : ''}</b><small>支出 ${twd(s.e)}${s.i ? ' · 收入 ' + twd(s.i) : ''}</small></span>
      <button class="mini" onclick="projMenu('${p.id}')">${ic('edit',18)}</button></div>`; }).join('') : '<div class="empty">還沒有專案<br>記帳時也可以直接新增</div>'}</div>
    <div class="hint">專案用來單獨統計一件事花多少，例如一趟旅行。結束的專案不會出現在記帳選單。</div></div></div>`;
}
function newProj(){ const n = prompt('專案名稱'); if (n && n.trim()) { put('projects', {id:'p_' + uid(), name:n.trim(), createdAt:Date.now(), archived:false, hidden:false}, true); redraw('pm'); } }
function projMenu(id){
  const p = S.data.projects[id];
  const a = prompt(`「${p.name}」\n輸入 1 改名、2 ${p.archived ? '重新啟用' : '標記結束'}、3 刪除`);
  if (a === '1') { const n = prompt('新名稱', p.name); if (n && n.trim()) p.name = n.trim(); }
  else if (a === '2') p.archived = !p.archived;
  else if (a === '3') { if (!confirm('刪除專案？紀錄會保留但不再屬於此專案')) return; p.hidden = true; }
  else return;
  put('projects', p, true); redraw('pm');
}

/* ---------- rates ---------- */
async function refreshRates(force){
  if (!force && Date.now() - (RATES.at || 0) < 6 * 3600e3) return;
  try {
    const r = await fetch('https://open.er-api.com/v6/latest/TWD'); const j = await r.json();
    if (j.result !== 'success') throw 0;
    const out = {}; for (const c of Object.keys(CUR)) if (c !== 'TWD' && j.rates[c]) out[c] = 1 / j.rates[c];
    RATES = {at:Date.now(), r:out}; localStorage.setItem(RATE_KEY, JSON.stringify(RATES)); bump(); render();
    if (force) toast('匯率已更新');
  } catch(e) { if (force) toast('匯率更新失敗，請確認網路'); }
}

/* ---------- cloud ---------- */
function renderLogin(){
  $('#app').innerHTML = `<div class="login"><h1>Money</h1><p class="tx2" style="margin:0 0 28px">登入後所有裝置同步</p>
    <div class="fld"><label>Email</label><input id="em" type="email" autocomplete="email"></div>
    <div class="fld"><label>密碼（至少 6 碼）</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn" onclick="doLogin(false)">登入</button>
    <button class="btn sec2" style="margin-top:10px" onclick="doLogin(true)">第一次使用，建立帳號</button>
    <button style="display:block;margin:18px auto 0;color:var(--tx2);font-size:13px" onclick="resetPw()">忘記密碼</button></div>`;
}
async function doLogin(isNew){
  const e = $('#em').value.trim(), p = $('#pw').value;
  if (!e || p.length < 6) return toast('請輸入 Email 與 6 碼以上密碼');
  try { isNew ? await auth.createUserWithEmailAndPassword(e, p) : await auth.signInWithEmailAndPassword(e, p); }
  catch(err) { toast({'auth/invalid-credential':'帳號或密碼錯誤','auth/wrong-password':'密碼錯誤','auth/user-not-found':'沒有這個帳號','auth/email-already-in-use':'這個 Email 已註冊，請直接登入','auth/invalid-email':'Email 格式錯誤'}[err.code] || err.code); }
}
async function resetPw(){ const e = $('#em').value.trim(); if (!e) return toast('先輸入 Email'); try { await auth.sendPasswordResetEmail(e); toast('重設信已寄出'); } catch(err) { toast(err.code); } }
function logout(){ if (!confirm('登出？')) return; unsubs.forEach(u => u()); unsubs = []; auth.signOut(); }
async function batchWrite(lref, data){
  const ops = [];
  const now = Date.now();
  for (const col of COLS) for (const o of Object.values(data[col] || {})) ops.push([col, {...o, updatedAt:o.updatedAt || now}]);
  for (let i = 0; i < ops.length; i += 400) {
    const b = db.batch(); ops.slice(i, i + 400).forEach(([col, o]) => b.set(lref.collection(col).doc(o.id), clean(o))); await b.commit();
  }
}
/* ---------- 秒開：把上次的資料存在手機裡，開 App 先顯示，再背景同步 ---------- */
let AUTH_KNOWN = false, READY_ONCE = false;
const SNAP_DB = 'money_snap' + STORE_NS;
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open(SNAP_DB, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function snapGet(){ try { const d = await idb(); return await new Promise(res => { const q = d.transaction('kv').objectStore('kv').get('snap'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch(e) { return null; } }
let snapT;
function snapSave(){
  if (S.mode !== 'cloud' || !S.user || !S.ready || !S.ledgerId) return;
  clearTimeout(snapT);
  snapT = setTimeout(async () => { try { const d = await idb(); d.transaction('kv', 'readwrite').objectStore('kv').put({uid:S.user.uid, lid:S.ledgerId, data:S.data, settings:S.settings, at:Date.now()}, 'snap'); } catch(e) {} }, 1500);
}
async function snapClear(){ try { const d = await idb(); d.transaction('kv', 'readwrite').objectStore('kv').delete('snap'); } catch(e) {} }
function readyOnce(){ if (READY_ONCE) return; READY_ONCE = true; afterReady(); }
const emptyData = () => ({accounts:{}, txns:{}, categories:{}, projects:{}, recurring:{}, templates:{}, plans:{}});

async function attachLedger(u, keep){
  if (!keep) { S.ready = false; render(); }
  const uref = db.collection('users').doc(u.uid);
  let lid = keep ? S.ledgerId : null;
  if (!lid) { const snap = await uref.get(); lid = snap.exists ? snap.data().ledgerId : null; }
  if (!lid) {
    lid = 'l_' + uid();
    const lref = db.collection('ledgers').doc(lid);
    await lref.set({name:'我的帳本', owner:u.uid, members:[u.uid], createdAt:Date.now()});
    const local = readLocal();
    const hasLocal = local && Object.keys(local.data?.txns || {}).length;
    const seed = hasLocal && confirm('這支手機有本機模式的資料，要上傳到雲端帳本嗎？') ? local.data : defaultData();
    await batchWrite(lref, seed);
    if (hasLocal && seed === local.data && local.settings) await lref.collection('meta').doc('settings').set(local.settings);
    await uref.set({ledgerId:lid});
  }
  S.ledgerId = lid; ledgerRef = db.collection('ledgers').doc(lid);
  while (PENDING.length) PENDING.shift()(ledgerRef);
  let pending = COLS.length + 1; const done = () => { if (--pending === 0) { S.ready = true; bump(); render(); readyOnce(); } };
  let rt; const sched = () => { clearTimeout(rt); rt = setTimeout(() => { bump(); if (S.ready) render(); }, 60); };
  // 先讀手機裡的快取（不計費），再只向雲端要「有變動」的資料，省讀取額度
  const cachedAll = keep ? null : await Promise.all(COLS.map(col => ledgerRef.collection(col).get({source:'cache'}).catch(() => null)));
  for (const [ci, col] of COLS.entries()) {
    let maxU = 0;
    if (keep) { S.data[col] = S.data[col] || {}; for (const o of Object.values(S.data[col])) maxU = Math.max(maxU, +o.updatedAt || 0); }
    else { const cached = {}; cachedAll[ci]?.forEach(d => { const o = d.data(); maxU = Math.max(maxU, +o.updatedAt || 0); if (!o.deleted) cached[d.id] = o; }); S.data[col] = cached; }
    const q = maxU ? ledgerRef.collection(col).where('updatedAt', '>', maxU - 600000) : ledgerRef.collection(col);
    let first = true;
    unsubs.push(q.onSnapshot(qs => {
      qs.docChanges().forEach(ch => { if (ch.type === 'removed') return; const o = ch.doc.data(); if (o.deleted) delete S.data[col][ch.doc.id]; else S.data[col][ch.doc.id] = o; });
      sched(); if (first) { first = false; done(); }
    }, e => { toast('讀取失敗：' + e.code); if (first) { first = false; done(); } }));
  }
  let firstS = true;
  unsubs.push(ledgerRef.collection('meta').doc('settings').onSnapshot(d => { if (d.exists) { S.settings = {...S.settings, ...d.data()}; if (S.settings.carrier) { P.carrier = S.settings.carrier; savePrefs(); } applyTheme(); sched(); } if (firstS) { firstS = false; done(); } }));
}

/* ---------- boot ---------- */
function afterReady(){
  if (location.hash === '#add') { history.replaceState(null, '', location.pathname + location.search); openAdd(); }
  else if (location.hash === '#search') { history.replaceState(null, '', location.pathname + location.search); openSearch(); }
}
function openTplMgr(){ F = blankF(); openTpl(); }
function boot(){
  if (location.hash === '#carrier' && FEAT.carrier) S.ui.tab = 'carrier';
  if (P.pin) lockNow();
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (FIREBASE_CONFIG && typeof firebase === 'undefined') {
    $('#app').innerHTML = `<div class="login"><h1>Money</h1><p>無法載入雲端元件，請確認網路後重新開啟。</p><button class="btn" onclick="location.reload()">重新載入</button></div>`; return;
  }
  if (FIREBASE_CONFIG) {
    S.mode = 'cloud';
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(() => {});
    auth = firebase.auth();
    applyTheme(); render();
    const snapP = P.lastUid ? snapGet() : Promise.resolve(null);
    snapP.then(sn => {
      if (sn && sn.uid === P.lastUid && !S.user) {
        S.data = {...emptyData(), ...sn.data}; S.settings = {...S.settings, ...(sn.settings || {})};
        S.user = {uid:sn.uid, email:P.lastEmail || '', fromSnap:true}; S.ledgerId = sn.lid; S.ready = true;
        bump(); applyTheme(); render(); readyOnce();
      }
    }).finally(() => {
      auth.onAuthStateChanged(u => {
        AUTH_KNOWN = true;
        if (!u) {
          unsubs.forEach(f => f()); unsubs = []; ledgerRef = null; S.user = null; S.ledgerId = null; S.ready = false; READY_ONCE = false;
          S.data = emptyData(); snapClear(); P.lastUid = null; savePrefs(); render(); return;
        }
        const keep = !!(S.user && S.user.uid === u.uid && S.ready && S.ledgerId);
        if (!keep) { S.data = emptyData(); S.ledgerId = null; }
        S.user = u; P.lastUid = u.uid; P.lastEmail = u.email; savePrefs();
        if (keep) render();
        attachLedger(u, keep).catch(e => { toast('連線失敗：' + (e.code || e.message)); });
      });
    });
  } else {
    S.mode = 'local';
    const l = readLocal();
    if (l && l.data) { S.data = {accounts:{}, txns:{}, categories:{}, projects:{}, recurring:{}, templates:{}, plans:{}, ...l.data}; S.settings = {...S.settings, ...(l.settings || {})}; }
    else { S.data = defaultData(); saveLocal(); }
    if (!S.settings.carrier && P.carrier) S.settings.carrier = P.carrier;
    S.ready = true; bump(); applyTheme(); render(); afterReady();
  }
  refreshRates();
}
/* 返回：Android 返回鍵／手勢、瀏覽器上一頁、iPhone 主畫面 App 從左邊緣右滑 */
function canGoBack(){ return !LOCKED && (LAYERS.length > 0 || S.ui.tab !== 'home'); }
function goBack(){
  if (LOCKED) return false;
  if (LAYERS.length) {
    const top = LAYERS[LAYERS.length - 1];
    if (top.key === 'add' && hasDraft() && !confirm('放棄這筆還沒存的紀錄？')) return true;
    if (top.key === 'cm' && CM.adding) { CM.adding = null; redraw('cm'); return true; }
    closeLayer(top.key); return true;
  }
  if (S.ui.tab === 'acct') { go('accounts'); return true; }
  if (S.ui.tab !== 'home') { go('home'); return true; }
  return false;
}
try { history.replaceState({base:1}, ''); history.pushState({guard:1}, ''); } catch(e) {}
addEventListener('popstate', () => {
  if (canGoBack()) { goBack(); try { history.pushState({guard:1}, ''); } catch(e) {} }
  else if (LOCKED) { try { history.pushState({guard:1}, ''); } catch(e) {} }
  else history.back();
});
(function(){
  if (navigator.standalone !== true) return;   // 只有 iPhone 主畫面 App 需要自己做手勢；瀏覽器與 Android 用系統返回
  let x0 = null, y0 = 0, ind = null;
  addEventListener('touchstart', e => { const t = e.touches[0]; if (t.clientX > 22 || !canGoBack()) return; x0 = t.clientX; y0 = t.clientY;
    ind = document.createElement('div'); ind.id = 'swipeback'; ind.innerHTML = ic('left', 22); document.body.appendChild(ind); }, {passive:true});
  addEventListener('touchmove', e => { if (x0 === null) return; const t = e.touches[0], dx = Math.max(0, t.clientX - x0);
    ind.style.transform = `translate(${Math.min(dx, 90) - 44}px, ${t.clientY - 22}px) scale(${Math.min(1, .5 + dx / 160)})`; ind.style.opacity = Math.min(1, dx / 70); }, {passive:true});
  addEventListener('touchend', e => { if (x0 === null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = Math.abs(t.clientY - y0);
    x0 = null; ind && ind.remove(); ind = null; if (dx > 70 && dy < 80) goBack(); });
  addEventListener('touchcancel', () => { x0 = null; ind && ind.remove(); ind = null; });
})();

/* 離開 App 再回來：回到首頁＋今天（停靠點）。正在記帳且已輸入內容時保留，避免資料遺失 */
let awayAt = 0, BUSY_UNTIL = 0;
const LAUNCH_CARRIER = location.hash === '#carrier' && FEAT.carrier;
function hasDraft(){ return LAYERS.some(l => l.key === 'add') && F && (F.amtExpr || F.note.trim()); }
function backToDock(){
  if (!S.ready || Date.now() < BUSY_UNTIL) return;
  const keepAdd = hasDraft();
  for (const L of [...LAYERS]) if (!(keepAdd && L.key === 'add')) closeLayer(L.key, true);
  const n = new Date();
  S.ui.sel = today(); S.ui.sorting = false; S.ui.rp = {...S.ui.rp, per:'month', y:n.getFullYear(), m:n.getMonth()};
  S.ui.tab = LAUNCH_CARRIER ? 'carrier' : 'home';
  history.replaceState(null, '', location.pathname + location.search + (LAUNCH_CARRIER ? '#carrier' : ''));
  render(); scrollTo(0, 0);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { awayAt = Date.now(); return; }
  if (awayAt && Date.now() - awayAt >= (+P.dockAfter || 0) * 1000) backToDock();
});
/* 隱藏主機商自動插入的浮動標籤（例如 Powered by Netlify），避免擋住下方按鈕 */
(function(){
  const OWN = new Set(['app', 'nav', 'layers', 'toast', 'lock', 'swipeback']);
  const hide = () => {
    for (const el of [...document.body.children, ...[...document.documentElement.children].filter(e => e !== document.head && e !== document.body)]) {
      if (/^(SCRIPT|STYLE|LINK|TEMPLATE|META)$/.test(el.tagName) || OWN.has(el.id) || el.dataset.own || el.classList.contains('sortable-fallback')) continue;
      el.style.setProperty('display', 'none', 'important'); el.style.setProperty('visibility', 'hidden', 'important'); el.style.setProperty('pointer-events', 'none', 'important');
    }
  };
  new MutationObserver(hide).observe(document.body, {childList:true});
  new MutationObserver(hide).observe(document.documentElement, {childList:true});
  hide(); setTimeout(hide, 1500); setTimeout(hide, 5000);
})();
boot();
